services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: degenlab
      POSTGRES_PASSWORD: degenlab
      POSTGRES_DB: degenlab
    ports:
      - "5432:5432"
    volumes:
      - degenlab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degenlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  degenlab_pg:
